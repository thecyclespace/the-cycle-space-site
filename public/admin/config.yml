          - { label: "Manifesto — Titre", name: "manifestoTitle", widget: "string" }
          - { label: "Manifesto — Texte", name: "manifestoText", widget: "text" }
          - { label: "Manifesto — Citation", name: "manifestoQuote", widget: "string" }

          - { label: "Services — Titre de section", name: "pillarsTitle", widget: "string" }
          - { label: "Services — Sous-titre", name: "pillarsSubtitle", widget: "text" }
          - label: "Services — Cartes (3 ou 4 cartes)"
