          - { label: "Ressources — Email invalide (msg)", name: "guideInvalidEmail", widget: "string" }
          - { label: "Ressources — Mention RGPD", name: "guideConsent", widget: "text" }
          - { label: "Ressources — Merci (titre)", name: "guideThanksTitle", widget: "string" }
