# Sveltia CMS — The Cycle Space
# ----------------------------------------------------------------------------
# Backend : GitHub (le CMS commit directement sur le dépôt GitHub).
#   - "Publish" = 1 commit sur `main` -> GitHub Actions reconstruit et publie sur GitHub Pages (~1-2 min).
#   - Pas de Netlify Identity, pas de Git Gateway, pas de serveur CMS séparé.
#
# Connexion (voir CMS_GUIDE.md) :
#   - Simple : bouton "Sign In with Token" -> coller un GitHub Personal Access Token.
#   - Confort (recommandé plus tard) : OAuth via "Sveltia CMS Authenticator" sur
#     Cloudflare Workers -> décommenter `base_url` ci-dessous.
#
# Édition en LOCAL : ouvrir http://localhost:5173/admin/ dans Chrome/Edge ; Sveltia
# utilise l'API File System Access pour lire/écrire directement le dépôt local
# (aucun proxy, aucun `decap-server`). `local_backend` n'est PAS nécessaire.
# ----------------------------------------------------------------------------

backend:
  name: github
  # ⚠️ Propriétaire/dépôt GitHub. Format : OWNER/REPO.
  repo: thecyclespace/the-cycle-space-site
  branch: main
  # OAuth « 1 clic » via le worker Cloudflare (Sveltia CMS Authenticator).
  # Remplace le service Netlify par défaut. Voir CMS_GUIDE.md.
  base_url: https://sveltia-cms-auth.thecyclespaceadmin.workers.dev

media_folder: "public/uploads"
public_folder: "/uploads"

# Limites/format des médias uploadés via le CMS.
media_libraries:
  default:
    config:
      slugify_filename: true   # renomme les fichiers en minuscules-sans-accents-tirets
      max_file_size: 3000000   # 3 Mo max par image (évite les uploads trop lourds)

# URL du site (utilisée pour le bouton "View" du CMS).
# À mettre à jour si le domaine définitif change.
site_url: https://thecyclespace.com
display_url: thecyclespace.com
logo_url: /elsa.jpg

# IMPORTANT — Pour préserver la structure plate des fichiers JSON et ne pas
# casser les composants React, on n'utilise PAS de `widget: object` containers
# pour regrouper les champs. Le découpage visuel se fait via des préfixes
# emoji + section dans les labels (ex: "🎯 Hero — Titre"), ce qui permet à
# l'éditrice de scanner le formulaire facilement sans nesting des données.

collections:

  # ===========================================================================
  # 📝 ARTICLES DE BLOG  (collection prioritaire — créée souvent)
  # ===========================================================================
  - name: blog
    label: "📝 Articles de blog"
    label_singular: "Article"
    description: "Articles éditoriaux + outils interactifs. Format Markdown — utilise la barre d'outils pour mettre en forme."
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}} ({{lang}})"
    sortable_fields: [date, title]
    view_groups:
      - { label: "Par langue", field: lang }
      - { label: "Par type d'outil", field: tool }
    fields:
      # ---- Informations principales ----------------------------------------
      - { label: "Titre", name: "title", widget: "string", hint: "Le titre principal affiché en haut de l'article et dans la liste." }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Extrait (résumé court)", name: "excerpt", widget: "text", hint: "1 à 3 phrases. Affiché dans la liste des articles et en sous-titre de l'article." }
      - { label: "Image de couverture (optionnel)", name: "coverImage", widget: "image", required: false, hint: "Optionnel. Format paysage recommandé (1200×630 px)." }
      - { label: "Brouillon", name: "draft", widget: "boolean", default: false, required: false, hint: "Si coché, l'article ne sera pas publié sur le site." }

      # ---- Langue et organisation ------------------------------------------
      - label: "Langue de l'article"
        name: "lang"
        widget: "select"
        required: true
        default: "fr"
        options:
          - { label: "Français", value: "fr" }
          - { label: "English", value: "en" }
        hint: "L'article apparaît uniquement dans la liste correspondant à cette langue."

      - { label: "Slug de l'article traduit (optionnel)", name: "translation", widget: "string", required: false, hint: "Slug de la version EN/FR de cet article. Ex: si cet article est en FR et qu'il existe une version EN à /blog/period-calculator, mets 'period-calculator'. Permet au toggle EN/FR du header de naviguer vers la traduction." }

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        field: { label: "Tag", name: "tag", widget: "string" }
        hint: "Mots-clés thématiques (cycle, hormones, contraception…). Affichés dans le SEO uniquement."

      # ---- Outil interactif (optionnel) ------------------------------------
      - label: "Outil interactif (optionnel)"
        name: "tool"
        widget: "select"
        required: false
        options:
          - { label: "Aucun", value: "" }
          - { label: "Calculateur de cycle menstruel", value: "period-calculator" }
          - { label: "Où en suis-je dans mon cycle ?", value: "cycle-phase" }
          - { label: "Mon cycle est-il régulier ?", value: "cycle-regularity" }
          - { label: "Après l'arrêt de la pilule / DIU", value: "post-contraception" }
          - { label: "Mini journal température basale & glaire cervicale", value: "basal-tracker" }
        default: ""
        hint: "Si défini, insère le widget interactif à l'emplacement du marqueur <!-- calculator --> dans le contenu Markdown."

      # ---- Contenu ---------------------------------------------------------
      - { label: "Contenu de l'article", name: "body", widget: "markdown", hint: "Éditeur riche — titres, listes, citations, images, liens. Utilise <!-- calculator --> sur une ligne seule pour positionner un widget interactif." }

  # ===========================================================================
  # 🌐 PAGE D'ACCUEIL — TEXTES (English)
  # ===========================================================================
  - name: en
    label: "🇬🇧 Textes du site — Anglais"
    description: "TOUS les textes en anglais (accueil, services, à propos, menus, pied de page…). Repère chaque section grâce à l'emoji au début du libellé : 🧭 menu · 🎯 hero · ✍️ manifesto · 🛠 services · 💗 pour toi · 📚 ressources · 🎬 CTA · ⚓ footer."
    editor: { preview: false }
    files:
      - name: home_en
        label: "Tous les textes (anglais)"
        file: "src/content/i18n/en.json"
        format: "json"
        fields:

          # 🧭 NAVIGATION ===================================================
          - label: "🧭 Navigation (header)"
            name: "nav"
            widget: "list"
            min: 4
            max: 4
            collapsed: true
            summary: "{{fields.label}}  →  {{fields.route}}"
            hint: "Les 4 entrées du menu en haut du site. Tu peux renommer les libellés. La route (l'adresse) est verrouillée par un menu déroulant pour éviter de casser les liens si tu réordonnes."
            fields:
              - { label: "Libellé visible", name: "label", widget: "string" }
              - label: "Route (adresse)"
                name: "route"
                widget: "select"
                options:
                  - { label: "Accueil  (/)", value: "/" }
                  - { label: "Services  (/services)", value: "/services" }
                  - { label: "Ressources / Blog  (/blog)", value: "/blog" }
                  - { label: "À propos  (/about)", value: "/about" }

          - { label: "🧭 Bouton 'Book' (header)", name: "book", widget: "string", hint: "Texte du bouton bordeaux en haut à droite." }

          # 🎯 HERO ==========================================================
          - { label: "🎯 Hero — Titre principal", name: "heroTitle", widget: "string", hint: "Garde court — moins de 90 caractères pour bien tenir sur mobile." }
          - { label: "🎯 Hero — Petite ligne au-dessus du titre (qui parle)", name: "heroKicker", widget: "string", hint: "Ton prénom et ton métier : on doit comprendre tout de suite qu'une vraie personne est derrière le site." }
          - { label: "🎯 Hero — Légende sous ta photo", name: "heroCaption", widget: "string", required: false }
          - { label: "🎯 Hero — Texte d'introduction", name: "heroText", widget: "text" }
          - { label: "🎯 Hero — Bouton secondaire (gris)", name: "heroSecondary", widget: "string" }
          - { label: "🎯 Hero — Ligne de confiance (sous les boutons)", name: "trust", widget: "string" }

          # ✍️ MANIFESTO =====================================================
          - { label: "✍️ Manifesto — Titre", name: "manifestoTitle", widget: "string", hint: "Évite les espaces multiples — utilise une seule ligne." }
          - { label: "✍️ Manifesto — Texte", name: "manifestoText", widget: "text" }
          - { label: "✍️ Manifesto — Citation (italique)", name: "manifestoQuote", widget: "string" }

          # 🛠 SERVICES ======================================================
          - { label: "🛠 Services — Titre de section", name: "pillarsTitle", widget: "string" }
          - { label: "🛠 Services — Sous-titre", name: "pillarsSubtitle", widget: "text" }
          - label: "🛠 Services — Offres (3 ou 4 maximum)"
            name: "services"
            widget: "list"
            min: 3
            max: 4
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag (petite ligne)", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Résumé (1 phrase, visible sur la carte)", name: "summary", widget: "string", hint: "L'essentiel de l'offre en une phrase." }
              - { label: "Pour qui (1 phrase, visible sur la carte)", name: "audience", widget: "string", required: false }
              - { label: "Description complète (dans « Voir le détail »)", name: "body", widget: "text", hint: "Saute une ligne vide pour créer un nouveau paragraphe." }
              - { label: "Pour qui (optionnel)", name: "forWho", widget: "text", required: false }
              - { label: "Ce que tu emportes (optionnel)", name: "leave", widget: "text", required: false }
              - { label: "Prix affiché (optionnel)", name: "priceLabel", widget: "string", required: false, hint: "Ex : « 90 € » ou « Gratuit ». Laisse vide tant que le prix n'est pas décidé : rien ne s'affichera." }
              - { label: "Texte du CTA", name: "cta", widget: "string" }
              - label: "Action du bouton"
                name: "action"
                widget: "select"
                default: "intro"
                options:
                  - { label: "Réserver l'Introduction (Calendly)", value: "intro" }
                  - { label: "Réserver le Rhythm Check-In (Calendly)", value: "checkin" }
                  - { label: "Liste d'attente (email)", value: "waitlist" }
          - label: "🛠 Services — Intitulés des blocs"
            name: "servicesLabels"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Intitulé 'Pour qui'", name: "forWho", widget: "string" }
              - { label: "Intitulé 'Ce que tu emportes'", name: "leave", widget: "string" }
              - { label: "Libellé du bouton « voir le détail »", name: "more", widget: "string" }
          - label: "🧬 Méthode Inner Rhythm (accueil + services)"
            name: "method"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker accueil (philosophie)", name: "kicker", widget: "string" }
              - { label: "Titre de la section sur l'accueil", name: "homeTitle", widget: "string", hint: "En mots simples, ex. « Comment je t'accompagne »." }
              - { label: "Titre de la méthode", name: "title", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Lien accueil -> services", name: "cta", widget: "string" }
              - { label: "Programme — Kicker", name: "programmeKicker", widget: "string" }
              - { label: "Programme — Titre", name: "programmeTitle", widget: "string" }
              - { label: "Programme — Détails (durée, langues)", name: "programmeMeta", widget: "string" }
              - { label: "Programme — Texte du bouton", name: "programmeCta", widget: "string" }
              - label: "Phases (4)"
                name: "phases"
                widget: "list"
                min: 4
                max: 4
                summary: "{{fields.num}} — {{fields.title}}"
                fields:
                  - { label: "Numéro", name: "num", widget: "select", default: "01", options: ["01", "02", "03", "04"] }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre (tag)", name: "tag", widget: "string" }
                  - { label: "Accueil — nom simple de l'étape", name: "homeTitle", widget: "string", hint: "Ex. « Comprendre »." }
                  - { label: "Accueil — l'étape en une phrase", name: "short", widget: "text", hint: "Une phrase concrète, comme tu l'expliquerais à voix haute." }
                  - { label: "Description", name: "body", widget: "text" }
                  - { label: "Points clés", name: "points", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
                  - { label: "Résultat", name: "outcome", widget: "text" }
                  - { label: "Citation", name: "quote", widget: "string" }

          - label: "🎯 Accueil — « Qu'est-ce qui t'amène ? » (cartes)"
            name: "concerns"
            widget: "object"
            collapsed: true
            hint: "Petites cartes avec icône sous le hero. Garde des intitulés courts, sans promesse médicale."
            fields:
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Petite mention sous les cartes", name: "note", widget: "string" }
              - { label: "Phrase pour celles qui ne se reconnaissent dans aucune carte", name: "unsure", widget: "text", hint: "Suivie d'un lien vers l'appel gratuit." }
              - label: "Cartes (6 conseillées)"
                name: "items"
                widget: "list"
                min: 2
                max: 8
                summary: "{{fields.title}}"
                fields:
                  - label: "Icône"
                    name: "icon"
                    widget: "select"
                    default: "cycle"
                    options:
                      - { label: "Goutte", value: "drop" }
                      - { label: "Humeur", value: "mood" }
                      - { label: "Cycle", value: "cycle" }
                      - { label: "Vagues (hormones)", value: "waves" }
                      - { label: "Contraception", value: "capsule" }
                      - { label: "Pousse (fertilité)", value: "sprout" }
                  - { label: "Intitulé court", name: "title", widget: "string" }
                  - label: "Où mène la carte ?"
                    name: "link"
                    widget: "select"
                    default: "services"
                    options:
                      - { label: "Page Services", value: "services" }
                      - { label: "Page À propos", value: "about" }
                      - { label: "Page Ressources / Blog", value: "blog" }
                      - { label: "Outil : Mon cycle est-il régulier ?", value: "regularity" }
                      - { label: "Outil : Après l'arrêt de la contraception", value: "post-contraception" }
                      - { label: "Outil : Température basale & glaire", value: "basal" }
                      - { label: "Outil : Où en suis-je dans mon cycle ?", value: "where-am-i" }
                      - { label: "Outil : Calculateur de cycle", value: "calculator" }
          - label: "👤 Accueil — Présentation d'Elsa (courte)"
            name: "meetElsa"
            widget: "object"
            collapsed: true
            hint: "Ton histoire en quelques lignes, à la première personne. Le récit complet est sur la page À propos."
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte (2 courts paragraphes)", name: "text", widget: "text" }
              - { label: "Texte du bouton", name: "cta", widget: "string" }
          - { label: "🛠 Accueil — Titre de la section offres", name: "offersTitle", widget: "string" }
          - { label: "🛠 Accueil — Lien « voir tous les détails »", name: "offersCta", widget: "string" }
          - label: "🖼 Textes alternatifs des images (accessibilité + Google)"
            name: "imageAlts"
            widget: "object"
            collapsed: true
            hint: "Décris chaque image en une phrase. Lu par les lecteurs d'écran et utile pour Google."
            fields:
              - { label: "Image consultation en ligne", name: "online", widget: "string" }
              - { label: "Image de l'outil (carnet)", name: "tool", widget: "string" }
              - { label: "Image du blog", name: "blog", widget: "string" }
              - { label: "Photo d'Elsa", name: "elsa", widget: "string" }
          - label: "👤 Page À propos — intertitres"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre « son approche »", name: "approachKicker", widget: "string" }
              - { label: "Présentation courte sous le titre de la page", name: "intro", widget: "text", hint: "Qui tu es, ta formation, et ce que tu n'es pas (médecin)." }
              - { label: "Titre « est-ce pour toi ? »", name: "forYouKicker", widget: "string" }
              - { label: "Titre de son histoire", name: "storyTitle", widget: "string" }
              - { label: "Bouton « lire son histoire »", name: "storyToggle", widget: "string" }

          # 💗 POUR TOI / PAS POUR TOI =======================================
          - { label: "💗 Pour toi — Titre", name: "forYouTitle", widget: "string" }
          - label: "💗 Pour toi — Items"
            name: "forYou"
            widget: "list"
            hint: "Recommandé : 5 à 7 items courts."
            field: { label: "Item", name: "item", widget: "text" }

          # 🛤 PARCOURS (Services) ==========================================
          - label: "❓ Questions fréquentes (page Services)"
            name: "faq"
            widget: "object"
            collapsed: true
            hint: "Quelques questions courtes affichées en bas de la page Services. Évite toute promesse médicale."
            fields:
              - { label: "Titre de la section", name: "title", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                max: 8
                summary: "{{fields.q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Réponse", name: "a", widget: "text" }
          - { label: "🛤 Parcours — Titre de section", name: "journeyTitle", widget: "string" }
          - label: "🛤 Parcours — Étapes (4)"
            name: "journey"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - label: "Numéro"
                name: "num"
                widget: "select"
                default: "01"
                options: ["01", "02", "03", "04"]
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "body", widget: "text" }

          # 📚 RESSOURCES (PDF gratuit) ======================================
          - { label: "📚 Ressources — Titre", name: "resourcesTitle", widget: "string" }
          - { label: "📚 Ressources — Texte", name: "resourcesText", widget: "text" }
          - { label: "📚 Ressources — Placeholder email", name: "emailPlaceholder", widget: "string" }
          - { label: "📚 Ressources — Bouton 'télécharger'", name: "download", widget: "string" }
          - { label: "📚 Ressources — Bouton 'télécharger à nouveau'", name: "guideDownloadAgain", widget: "string" }
          - { label: "📚 Ressources — Libellé du champ email", name: "guideEmailLabel", widget: "string" }
          - { label: "📚 Ressources — Case de consentement (RGPD)", name: "guideConsent", widget: "text", hint: "Texte à côté de la case à cocher. Il doit dire clairement à qui l'email est transmis." }
          - { label: "📚 Ressources — Erreur 'case non cochée'", name: "guideConsentRequired", widget: "string" }
          - { label: "📚 Ressources — Lien 'télécharger sans email'", name: "guideNoEmail", widget: "string" }
          - { label: "📚 Ressources — Texte du bouton pendant l'envoi", name: "guideSending", widget: "string" }
          - { label: "📚 Ressources — Erreur 'email invalide'", name: "guideInvalidEmail", widget: "string" }
          - { label: "📚 Ressources — Confirmation : titre", name: "guideThanksTitle", widget: "string" }
          - { label: "📚 Ressources — Confirmation : texte (sans email)", name: "guideThanksText", widget: "text" }
          - { label: "📚 Ressources — Confirmation : texte (email envoyé)", name: "guideSentText", widget: "text" }
          - { label: "📚 Ressources — Confirmation : texte (email non envoyé)", name: "guideFailedText", widget: "text" }

          # 🛠 BLOC OUTIL HOME ===============================================
          - label: "🛠 Bloc outil interactif sur la home"
            name: "homeTool"
            widget: "object"
            collapsed: true
            hint: "Section qui présente le calculateur de cycle juste avant le CTA final."
            fields:
              - { label: "Kicker (petite ligne)", name: "kicker", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Lien 'lire l'article'", name: "learnMore", widget: "string" }
              - { label: "Bouton de l'accueil (essayer l'outil)", name: "cta", widget: "string" }
              - { label: "Mention sous le bouton (résultats indicatifs)", name: "note", widget: "string", hint: "Garde une mention claire : les résultats sont des estimations, pas un avis médical ni une contraception." }

          # 👤 À PROPOS (page About) =========================================
          - { label: "👤 À propos — Titre", name: "aboutTitle", widget: "string" }
          - { label: "👤 À propos — Texte (paragraphes séparés par lignes vides)", name: "aboutText", widget: "text" }
          - label: "👤 À propos — Credentials"
            name: "credentials"
            widget: "list"
            field: { label: "Credential", name: "item", widget: "string" }

          # 🎬 CTA FINAL =====================================================
          - { label: "🎬 CTA final — Titre", name: "finalTitle", widget: "string" }
          - { label: "🎬 CTA final — Texte", name: "finalText", widget: "text" }
          - { label: "🎬 CTA final — Texte du bouton", name: "finalCta", widget: "string", hint: "Le bouton principal de la dernière section de chaque page." }

          # 📅 MODAL RÉSERVATION =============================================
          - { label: "📅 Modal réservation — Titre", name: "modalTitle", widget: "string" }
          - { label: "📅 Modal réservation — Texte", name: "modalText", widget: "text" }
          - { label: "📅 Modal — Bouton 'Open Calendly'", name: "calendly", widget: "string" }
          - { label: "📅 Modal — Texte de chargement", name: "calendlyLoading", widget: "string" }
          - { label: "📅 Modal — Texte d'erreur", name: "calendlyError", widget: "text" }

          # ⚓ PIED DE PAGE ==================================================
          - { label: "⚓ Pied de page — Tagline", name: "footerTagline", widget: "string" }
          - { label: "⚓ Pied de page — Disclaimer (sous le footer)", name: "disclaimer", widget: "text" }

          # 📱 MOBILE (optionnel) ============================================
          - { label: "📱 Mobile — Titre du hero (optionnel)", name: "mobileHeroTitle", widget: "string", required: false, default: "", hint: "Si rempli, ce titre remplace le titre principal sur écrans < 768px (mobile). Si vide, on garde le titre principal. Utile pour raccourcir un titre trop long sur petits écrans." }
          - { label: "📱 Mobile — Texte du hero (optionnel)", name: "mobileHeroText", widget: "text", required: false, default: "", hint: "Pareil que ci-dessus, mais pour le paragraphe d'introduction sous le titre. Vide = on garde le texte principal." }

  # ===========================================================================
  # 🌐 PAGE D'ACCUEIL — TEXTES (Français)
  # ===========================================================================
  - name: fr
    label: "🇫🇷 Textes du site — Français"
    description: "TOUS les textes en français (accueil, services, à propos, menus, pied de page…). Repère chaque section grâce à l'emoji au début du libellé : 🧭 menu · 🎯 hero · ✍️ manifesto · 🛠 services · 💗 pour toi · 📚 ressources · 🎬 CTA · ⚓ footer."
    editor: { preview: false }
    files:
      - name: home_fr
        label: "Tous les textes (français)"
        file: "src/content/i18n/fr.json"
        format: "json"
        fields:

          # 🧭 NAVIGATION ===================================================
          - label: "🧭 Navigation (header)"
            name: "nav"
            widget: "list"
            min: 4
            max: 4
            collapsed: true
            summary: "{{fields.label}}  →  {{fields.route}}"
            hint: "Les 4 entrées du menu en haut du site. Tu peux renommer les libellés. La route (l'adresse) est verrouillée par un menu déroulant pour éviter de casser les liens si tu réordonnes."
            fields:
              - { label: "Libellé visible", name: "label", widget: "string" }
              - label: "Route (adresse)"
                name: "route"
                widget: "select"
                options:
                  - { label: "Accueil  (/)", value: "/" }
                  - { label: "Services  (/services)", value: "/services" }
                  - { label: "Ressources / Blog  (/blog)", value: "/blog" }
                  - { label: "À propos  (/about)", value: "/about" }

          - { label: "🧭 Bouton 'Réserver' (header)", name: "book", widget: "string" }

          # 🎯 HERO ==========================================================
          - { label: "🎯 Hero — Titre principal", name: "heroTitle", widget: "string", hint: "Garde court — moins de 90 caractères pour bien tenir sur mobile." }
          - { label: "🎯 Hero — Petite ligne au-dessus du titre (qui parle)", name: "heroKicker", widget: "string", hint: "Ton prénom et ton métier : on doit comprendre tout de suite qu'une vraie personne est derrière le site." }
          - { label: "🎯 Hero — Légende sous ta photo", name: "heroCaption", widget: "string", required: false }
          - { label: "🎯 Hero — Texte d'introduction", name: "heroText", widget: "text" }
          - { label: "🎯 Hero — Bouton secondaire", name: "heroSecondary", widget: "string" }
          - { label: "📱 Mobile — Titre du hero (optionnel)", name: "mobileHeroTitle", widget: "string", required: false, default: "", hint: "Si rempli, ce titre remplace le titre principal sur mobile. Vide = on garde le titre principal." }
          - { label: "📱 Mobile — Texte du hero (optionnel)", name: "mobileHeroText", widget: "text", required: false, default: "", hint: "Pareil, pour le paragraphe sous le titre. Vide = on garde le texte principal." }
          - { label: "🎯 Hero — Ligne de confiance", name: "trust", widget: "string" }

          # ✍️ MANIFESTO =====================================================
          - { label: "✍️ Manifesto — Titre", name: "manifestoTitle", widget: "string", hint: "Évite les espaces multiples — utilise une seule ligne." }
          - { label: "✍️ Manifesto — Texte", name: "manifestoText", widget: "text" }
          - { label: "✍️ Manifesto — Citation (italique)", name: "manifestoQuote", widget: "string" }

          # 🛠 SERVICES ======================================================
          - { label: "🛠 Services — Titre de section", name: "pillarsTitle", widget: "string" }
          - { label: "🛠 Services — Sous-titre", name: "pillarsSubtitle", widget: "text" }
          - label: "🛠 Services — Offres (3 ou 4 maximum)"
            name: "services"
            widget: "list"
            min: 3
            max: 4
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag (petite ligne)", name: "tag", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Résumé (1 phrase, visible sur la carte)", name: "summary", widget: "string", hint: "L'essentiel de l'offre en une phrase." }
              - { label: "Pour qui (1 phrase, visible sur la carte)", name: "audience", widget: "string", required: false }
              - { label: "Description complète (dans « Voir le détail »)", name: "body", widget: "text", hint: "Saute une ligne vide pour créer un nouveau paragraphe." }
              - { label: "Pour qui (optionnel)", name: "forWho", widget: "text", required: false }
              - { label: "Ce que tu emportes (optionnel)", name: "leave", widget: "text", required: false }
              - { label: "Prix affiché (optionnel)", name: "priceLabel", widget: "string", required: false, hint: "Ex : « 90 € » ou « Gratuit ». Laisse vide tant que le prix n'est pas décidé : rien ne s'affichera." }
              - { label: "Texte du CTA", name: "cta", widget: "string" }
              - label: "Action du bouton"
                name: "action"
                widget: "select"
                default: "intro"
                options:
                  - { label: "Réserver l'Introduction (Calendly)", value: "intro" }
                  - { label: "Réserver le Rhythm Check-In (Calendly)", value: "checkin" }
                  - { label: "Liste d'attente (email)", value: "waitlist" }
          - label: "🛠 Services — Intitulés des blocs"
            name: "servicesLabels"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Intitulé 'Pour qui'", name: "forWho", widget: "string" }
              - { label: "Intitulé 'Ce que tu emportes'", name: "leave", widget: "string" }
              - { label: "Libellé du bouton « voir le détail »", name: "more", widget: "string" }
          - label: "🧬 Méthode Inner Rhythm (accueil + services)"
            name: "method"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Kicker accueil (philosophie)", name: "kicker", widget: "string" }
              - { label: "Titre de la section sur l'accueil", name: "homeTitle", widget: "string", hint: "En mots simples, ex. « Comment je t'accompagne »." }
              - { label: "Titre de la méthode", name: "title", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Lien accueil -> services", name: "cta", widget: "string" }
              - { label: "Programme — Kicker", name: "programmeKicker", widget: "string" }
              - { label: "Programme — Titre", name: "programmeTitle", widget: "string" }
              - { label: "Programme — Détails (durée, langues)", name: "programmeMeta", widget: "string" }
              - { label: "Programme — Texte du bouton", name: "programmeCta", widget: "string" }
              - label: "Phases (4)"
                name: "phases"
                widget: "list"
                min: 4
                max: 4
                summary: "{{fields.num}} — {{fields.title}}"
                fields:
                  - { label: "Numéro", name: "num", widget: "select", default: "01", options: ["01", "02", "03", "04"] }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Sous-titre (tag)", name: "tag", widget: "string" }
                  - { label: "Accueil — nom simple de l'étape", name: "homeTitle", widget: "string", hint: "Ex. « Comprendre »." }
                  - { label: "Accueil — l'étape en une phrase", name: "short", widget: "text", hint: "Une phrase concrète, comme tu l'expliquerais à voix haute." }
                  - { label: "Description", name: "body", widget: "text" }
                  - { label: "Points clés", name: "points", widget: "list", field: { label: "Point", name: "point", widget: "string" } }
                  - { label: "Résultat", name: "outcome", widget: "text" }
                  - { label: "Citation", name: "quote", widget: "string" }

          - label: "🎯 Accueil — « Qu'est-ce qui t'amène ? » (cartes)"
            name: "concerns"
            widget: "object"
            collapsed: true
            hint: "Petites cartes avec icône sous le hero. Garde des intitulés courts, sans promesse médicale."
            fields:
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Petite mention sous les cartes", name: "note", widget: "string" }
              - { label: "Phrase pour celles qui ne se reconnaissent dans aucune carte", name: "unsure", widget: "text", hint: "Suivie d'un lien vers l'appel gratuit." }
              - label: "Cartes (6 conseillées)"
                name: "items"
                widget: "list"
                min: 2
                max: 8
                summary: "{{fields.title}}"
                fields:
                  - label: "Icône"
                    name: "icon"
                    widget: "select"
                    default: "cycle"
                    options:
                      - { label: "Goutte", value: "drop" }
                      - { label: "Humeur", value: "mood" }
                      - { label: "Cycle", value: "cycle" }
                      - { label: "Vagues (hormones)", value: "waves" }
                      - { label: "Contraception", value: "capsule" }
                      - { label: "Pousse (fertilité)", value: "sprout" }
                  - { label: "Intitulé court", name: "title", widget: "string" }
                  - label: "Où mène la carte ?"
                    name: "link"
                    widget: "select"
                    default: "services"
                    options:
                      - { label: "Page Services", value: "services" }
                      - { label: "Page À propos", value: "about" }
                      - { label: "Page Ressources / Blog", value: "blog" }
                      - { label: "Outil : Mon cycle est-il régulier ?", value: "regularity" }
                      - { label: "Outil : Après l'arrêt de la contraception", value: "post-contraception" }
                      - { label: "Outil : Température basale & glaire", value: "basal" }
                      - { label: "Outil : Où en suis-je dans mon cycle ?", value: "where-am-i" }
                      - { label: "Outil : Calculateur de cycle", value: "calculator" }
          - label: "👤 Accueil — Présentation d'Elsa (courte)"
            name: "meetElsa"
            widget: "object"
            collapsed: true
            hint: "Ton histoire en quelques lignes, à la première personne. Le récit complet est sur la page À propos."
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte (2 courts paragraphes)", name: "text", widget: "text" }
              - { label: "Texte du bouton", name: "cta", widget: "string" }
          - { label: "🛠 Accueil — Titre de la section offres", name: "offersTitle", widget: "string" }
          - { label: "🛠 Accueil — Lien « voir tous les détails »", name: "offersCta", widget: "string" }
          - label: "🖼 Textes alternatifs des images (accessibilité + Google)"
            name: "imageAlts"
            widget: "object"
            collapsed: true
            hint: "Décris chaque image en une phrase. Lu par les lecteurs d'écran et utile pour Google."
            fields:
              - { label: "Image consultation en ligne", name: "online", widget: "string" }
              - { label: "Image de l'outil (carnet)", name: "tool", widget: "string" }
              - { label: "Image du blog", name: "blog", widget: "string" }
              - { label: "Photo d'Elsa", name: "elsa", widget: "string" }
          - label: "👤 Page À propos — intertitres"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre « son approche »", name: "approachKicker", widget: "string" }
              - { label: "Présentation courte sous le titre de la page", name: "intro", widget: "text", hint: "Qui tu es, ta formation, et ce que tu n'es pas (médecin)." }
              - { label: "Titre « est-ce pour toi ? »", name: "forYouKicker", widget: "string" }
              - { label: "Titre de son histoire", name: "storyTitle", widget: "string" }
              - { label: "Bouton « lire son histoire »", name: "storyToggle", widget: "string" }

          # 💗 POUR TOI / PAS POUR TOI =======================================
          - { label: "💗 Pour toi — Titre", name: "forYouTitle", widget: "string" }
          - label: "💗 Pour toi — Items"
            name: "forYou"
            widget: "list"
            hint: "Recommandé : 5 à 7 items courts."
            field: { label: "Item", name: "item", widget: "text" }

          # 🛤 PARCOURS ======================================================
          - label: "❓ Questions fréquentes (page Services)"
            name: "faq"
            widget: "object"
            collapsed: true
            hint: "Quelques questions courtes affichées en bas de la page Services. Évite toute promesse médicale."
            fields:
              - { label: "Titre de la section", name: "title", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                max: 8
                summary: "{{fields.q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Réponse", name: "a", widget: "text" }
          - { label: "🛤 Parcours — Titre de section", name: "journeyTitle", widget: "string" }
          - label: "🛤 Parcours — Étapes (4)"
            name: "journey"
            widget: "list"
            min: 4
            max: 4
            summary: "{{fields.num}} — {{fields.title}}"
            fields:
              - label: "Numéro"
                name: "num"
                widget: "select"
                default: "01"
                options: ["01", "02", "03", "04"]
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "body", widget: "text" }

          # 📚 RESSOURCES ====================================================
          - { label: "📚 Ressources — Titre", name: "resourcesTitle", widget: "string" }
          - { label: "📚 Ressources — Texte", name: "resourcesText", widget: "text" }
          - { label: "📚 Ressources — Placeholder email", name: "emailPlaceholder", widget: "string" }
          - { label: "📚 Ressources — Bouton 'télécharger'", name: "download", widget: "string" }
          - { label: "📚 Ressources — Bouton 'télécharger à nouveau'", name: "guideDownloadAgain", widget: "string" }
          - { label: "📚 Ressources — Libellé du champ email", name: "guideEmailLabel", widget: "string" }
          - { label: "📚 Ressources — Case de consentement (RGPD)", name: "guideConsent", widget: "text", hint: "Texte à côté de la case à cocher. Il doit dire clairement à qui l'email est transmis." }
          - { label: "📚 Ressources — Erreur 'case non cochée'", name: "guideConsentRequired", widget: "string" }
          - { label: "📚 Ressources — Lien 'télécharger sans email'", name: "guideNoEmail", widget: "string" }
          - { label: "📚 Ressources — Texte du bouton pendant l'envoi", name: "guideSending", widget: "string" }
          - { label: "📚 Ressources — Erreur 'email invalide'", name: "guideInvalidEmail", widget: "string" }
          - { label: "📚 Ressources — Confirmation : titre", name: "guideThanksTitle", widget: "string" }
          - { label: "📚 Ressources — Confirmation : texte (sans email)", name: "guideThanksText", widget: "text" }
          - { label: "📚 Ressources — Confirmation : texte (email envoyé)", name: "guideSentText", widget: "text" }
          - { label: "📚 Ressources — Confirmation : texte (email non envoyé)", name: "guideFailedText", widget: "text" }

          # 🛠 BLOC OUTIL HOME ===============================================
          - label: "🛠 Bloc outil interactif sur la home"
            name: "homeTool"
            widget: "object"
            collapsed: true
            hint: "Section qui présente le calculateur de cycle juste avant le CTA final."
            fields:
              - { label: "Kicker (petite ligne)", name: "kicker", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Lien 'lire l'article'", name: "learnMore", widget: "string" }
              - { label: "Bouton de l'accueil (essayer l'outil)", name: "cta", widget: "string" }
              - { label: "Mention sous le bouton (résultats indicatifs)", name: "note", widget: "string", hint: "Garde une mention claire : les résultats sont des estimations, pas un avis médical ni une contraception." }

          # 👤 À PROPOS ======================================================
          - { label: "👤 À propos — Titre", name: "aboutTitle", widget: "string" }
          - { label: "👤 À propos — Texte (paragraphes séparés par lignes vides)", name: "aboutText", widget: "text" }
          - label: "👤 À propos — Credentials"
            name: "credentials"
            widget: "list"
            field: { label: "Credential", name: "item", widget: "string" }

          # 🎬 CTA FINAL =====================================================
          - { label: "🎬 CTA final — Titre", name: "finalTitle", widget: "string" }
          - { label: "🎬 CTA final — Texte", name: "finalText", widget: "text" }
          - { label: "🎬 CTA final — Texte du bouton", name: "finalCta", widget: "string", hint: "Le bouton principal de la dernière section de chaque page." }

          # 📅 MODAL RÉSERVATION =============================================
          - { label: "📅 Modal réservation — Titre", name: "modalTitle", widget: "string" }
          - { label: "📅 Modal réservation — Texte", name: "modalText", widget: "text" }
          - { label: "📅 Modal — Bouton 'Open Calendly'", name: "calendly", widget: "string" }
          - { label: "📅 Modal — Texte de chargement", name: "calendlyLoading", widget: "string" }
          - { label: "📅 Modal — Texte d'erreur", name: "calendlyError", widget: "text" }

          # ⚓ PIED DE PAGE ==================================================
          - { label: "⚓ Pied de page — Tagline", name: "footerTagline", widget: "string" }
          - { label: "⚓ Pied de page — Disclaimer", name: "disclaimer", widget: "text" }

  # ===========================================================================
  # ⚙️ PARAMÈTRES DU SITE
  # ===========================================================================
  - name: settings
    label: "⚙️ Paramètres du site"
    description: "Coordonnées, liens externes, image principale, fichier guide PDF."
    editor: { preview: false }
    files:
      - name: site
        label: "Configuration générale"
        file: "src/content/settings/site.json"
        format: "json"
        fields:
          - { label: "Nom du site", name: "siteName", widget: "string" }
          - { label: "URL Calendly (réservation)", name: "bookingUrl", widget: "string", pattern: ['^https?://', "Doit commencer par http:// ou https://"], hint: "Lien Calendly complet, utilisé par le bouton de réservation." }
          - { label: "URL Calendly — The Introduction (optionnel)", name: "bookingUrlIntroduction", widget: "string", required: false, pattern: ['^$|^https://calendly\.com/[^\s]+$', "Doit être un lien Calendly complet qui commence par https://calendly.com/ (ou rester vide)"], hint: "Lien de l'événement Calendly 'Introduction'. Vide = lien Calendly général." }
          - { label: "URL Calendly — Rhythm Check-In (optionnel)", name: "bookingUrlCheckIn", widget: "string", required: false, pattern: ['^$|^https://calendly\.com/[^\s]+$', "Doit être un lien Calendly complet qui commence par https://calendly.com/ (ou rester vide)"], hint: "Lien de l'événement Calendly 'Rhythm Check-In'. Vide = lien Calendly général." }
          - { label: "Email qui reçoit les inscriptions au guide", name: "guideLeadEmail", widget: "string", pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Adresse email invalide"], hint: "Chaque personne qui demande le guide avec son email est envoyée ici. À la toute première inscription, un email de confirmation (FormSubmit) arrive sur cette adresse : clique sur le lien pour activer l'envoi." }
          - { label: "Email de contact", name: "contactEmail", widget: "string", pattern: ['^[^@]+@[^@]+\.[^@]+$', "Adresse email invalide"], hint: "Affiché dans le footer." }
          - { label: "URL Instagram", name: "instagramUrl", widget: "string", pattern: ['^https?://', "Doit commencer par http:// ou https://"] }
          - { label: "Image principale (Elsa)", name: "elsaImage", widget: "image", hint: "Sélectionne une image OU saisis le nom d'un fichier déjà dans /public (ex: elsa.jpg)." }
          - { label: "Fichier guide PDF (nom)", name: "guidePdf", widget: "string", hint: "Le PDF doit être présent dans /public à la racine." }
          - { label: "Nom du fichier de téléchargement", name: "guideFilename", widget: "string", hint: "Nom proposé au téléchargement côté visiteur (ex: 'The_Cycle_Space_Know_Your_Cycle.pdf')." }
          - { label: "Handle du pied de page", name: "footerHandle", widget: "string", hint: "Texte court affiché dans le footer (ex: 'thecyclespace.com · @elsa.thecyclespace')." }

  # ===========================================================================
  # 🔍 SEO (méta titres + descriptions)
  # ===========================================================================
  - name: images
    label: "🖼 Images du site"
    description: "Remplace les grandes photos du site. Format paysage conseillé (4:3 ou 3:2), 3 Mo maximum. Pense à décrire l'image dans « Textes du site » (textes alternatifs)."
    editor: { preview: false }
    files:
      - name: site_images
        label: "Images principales"
        file: "src/content/settings/images.json"
        format: "json"
        fields:
          - { label: "Accueil — consultation en ligne", name: "onlineImage", widget: "image" }
          - { label: "Accueil — outil / carnet de suivi", name: "toolImage", widget: "image" }
          - { label: "Bandeau de fin de page", name: "bannerImage", widget: "image", hint: "Image douce et sans texte : elle est assombrie derrière le texte." }
          - { label: "Page Services — image d'ambiance", name: "servicesImage", widget: "image" }
          - { label: "Page Ressources — image d'ambiance", name: "blogImage", widget: "image" }

  - name: seo
    label: "🔍 SEO (Google + réseaux sociaux)"
    description: "Titres et descriptions pour Google et le partage sur les réseaux sociaux (EN + FR)."
    editor: { preview: false }
    files:
      - name: meta
        label: "Métadonnées SEO"
        file: "src/content/seo/seo.json"
        format: "json"
        fields:
          - label: "🇬🇧 Anglais"
            name: "en"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre de la page (Google)", name: "title", widget: "string", hint: "Idéal entre 50 et 60 caractères." }
              - { label: "Meta description (Google)", name: "description", widget: "text", hint: "Idéal entre 140 et 160 caractères." }
              - { label: "Open Graph — Titre (réseaux sociaux)", name: "ogTitle", widget: "string" }
              - { label: "Open Graph — Description (réseaux sociaux)", name: "ogDescription", widget: "text" }
              - label: "Pages — Services, Ressources, À propos"
                name: "pages"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Services"
                    name: "services"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
                  - label: "Ressources / Blog"
                    name: "blog"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
                  - label: "À propos"
                    name: "about"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
          - label: "🇫🇷 Français"
            name: "fr"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre de la page (Google)", name: "title", widget: "string", hint: "Idéal entre 50 et 60 caractères." }
              - { label: "Meta description (Google)", name: "description", widget: "text", hint: "Idéal entre 140 et 160 caractères." }
              - { label: "Open Graph — Titre (réseaux sociaux)", name: "ogTitle", widget: "string" }
              - { label: "Open Graph — Description (réseaux sociaux)", name: "ogDescription", widget: "text" }
              - label: "Pages — Services, Ressources, À propos"
                name: "pages"
                widget: "object"
                collapsed: true
                fields:
                  - label: "Services"
                    name: "services"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
                  - label: "Ressources / Blog"
                    name: "blog"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
                  - label: "À propos"
                    name: "about"
                    widget: "object"
                    fields:
                      - { label: "Titre (Google)", name: "title", widget: "string" }
                      - { label: "Description (Google)", name: "description", widget: "text" }
