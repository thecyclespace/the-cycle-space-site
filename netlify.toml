# Netlify — The Cycle Space
# Optimisé pour limiter la consommation de credits du free tier (300 min/mois).
# Voir README.md > "Déploiement Netlify" pour la configuration complète.

[build]
  command = "npm run build"
  publish = "dist"
  # Skip le build si aucun fichier source pertinent n'a changé depuis le dernier build réussi.
  # Les commits Decap CMS touchent toujours src/content/, donc déclenchent toujours un build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ public/ index.html package.json package-lock.json vite.config.js tailwind.config.js postcss.config.js netlify.toml"

[build.environment]
  NODE_VERSION = "20"

# Belt-and-suspenders : même si Branch Deploys / Deploy Previews ne sont pas désactivés
# dans le dashboard Netlify, ces contextes échouent vite (~5 s) au lieu de lancer un build complet.
# RECOMMANDÉ : aussi désactiver dans l'UI Netlify > Site settings > Build & deploy > Deploy contexts.
[context.deploy-preview]
  command = "echo 'Deploy previews désactivés (politique build production uniquement).' && exit 1"

[context.branch-deploy]
  command = "echo 'Branch deploys désactivés (politique build production uniquement).' && exit 1"

# Cache long pour les assets hashés générés par Vite (filenames immuables).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin Decap CMS : pas d'indexation, pas de clickjacking.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"

# Decap CMS attend /admin/ avec slash final.
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# SPA fallback : toute route non-statique renvoie vers index.html pour que
# React Router prenne le relais (servies, /resources, /blog/<slug>, /about, ...).
# Les fichiers statiques (assets, /admin/*, /uploads/*) ont la priorité automatiquement.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
