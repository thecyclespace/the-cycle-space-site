<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#362E28" />
    <meta
      name="description"
      content="The Cycle Space helps women understand their cycle, hormones, symptoms and fertility signs through clinically grounded, deeply human online care."
    />
    <!-- Canonical (override par route via React) -->
    <link rel="canonical" href="https://thecyclespace.com/" />
    <!-- Open Graph -->
    <meta property="og:site_name" content="The Cycle Space" />
    <meta property="og:title" content="The Cycle Space" />
    <meta
      property="og:description"
      content="Women's health. Cycle education. Body literacy. Online sessions in English or French."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thecyclespace.com/" />
    <meta property="og:image" content="https://thecyclespace.com/og.jpg" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Cycle Space" />
    <meta
      name="twitter:description"
      content="Women's health. Cycle education. Body literacy. Online sessions in English or French."
    />
    <meta name="twitter:image" content="https://thecyclespace.com/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint (text shows in a fallback font, then swaps). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Aboreto&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Aboreto&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>The Cycle Space — Women's health, cycle education, body literacy</title>
    <!-- JSON-LD : WebSite schema (statique). Per-page schemas (Person, Article)
         sont injectés à l'hydratation par useJsonLd. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Cycle Space",
      "url": "https://thecyclespace.com",
      "description": "Women's health, cycle education and body literacy. Online consultations in English and French.",
      "inLanguage": ["en", "fr"]
    }
    </script>
    <!-- Prerendered pages contain animated blocks that start transparent: keep them readable without JavaScript. -->
    <noscript><style>[style*="opacity: 0"],[style*="opacity:0"]{opacity:1!important;transform:none!important}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
