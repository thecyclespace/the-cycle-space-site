name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public URL used for canonicals, sitemap and structured data.
          # Switch to https://thecyclespace.com when the custom domain is live (see NAMECHEAP_DNS.md).
          VITE_SITE_URL: https://thecyclespace.github.io/the-cycle-space-site
      # Content and build checks. If a change saved from the admin would break the site, the job stops
      # here: the site stays on its previous version and the admin shows "Mise en ligne échouée".
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
